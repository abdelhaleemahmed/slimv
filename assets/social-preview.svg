<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#667eea"/>
      <stop offset="1" stop-color="#764ba2"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- video frame + play glyph -->
  <g transform="translate(640,152)">
    <rect x="-72" y="-50" width="144" height="100" rx="18" fill="none" stroke="#ffffff" stroke-width="7" opacity="0.95"/>
    <path d="M -18 -27 L 36 0 L -18 27 Z" fill="#ffffff"/>
  </g>

  <text x="640" y="330" text-anchor="middle"
        font-family="'Segoe UI','DejaVu Sans',Arial,sans-serif"
        font-size="152" font-weight="700" fill="#ffffff" letter-spacing="2">slimv</text>

  <text x="640" y="398" text-anchor="middle"
        font-family="'Segoe UI','DejaVu Sans',Arial,sans-serif"
        font-size="46" fill="#ffffff" opacity="0.96">shrink video — keep the quality</text>

  <text x="640" y="474" text-anchor="middle"
        font-family="'Segoe UI','DejaVu Sans',Arial,sans-serif"
        font-size="30" fill="#ffffff" opacity="0.85">ffmpeg-driven  ·  H.265 / AV1  ·  QSV / NVENC  ·  VMAF-verified</text>

  <g transform="translate(640,548)">
    <rect x="-250" y="-30" width="500" height="60" rx="30" fill="#ffffff" opacity="0.14"/>
    <text x="0" y="9" text-anchor="middle"
          font-family="'DejaVu Sans Mono','Consolas',monospace"
          font-size="26" fill="#ffffff" opacity="0.95">github.com/abdelhaleemahmed/slimv</text>
  </g>
</svg>
