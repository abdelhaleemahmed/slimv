name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Let the workflow's token publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; newer pushes supersede in-flight ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the package + Sphinx toolchain
        run: pip install -e . sphinx sphinx_rtd_theme
      - name: Build HTML (warnings fail the build)
        run: |
          python -m sphinx -b html docs/source docs/_build/html -W
          touch docs/_build/html/.nojekyll
      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
